<!DOCTYPE html>
<html lang="eu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sinadura Bilketa</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            max-width: 700px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        form {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .1);
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            background: #0066cc;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #004f9e;
        }

        #mezua {
            margin-top: 15px;
            font-weight: bold;
        }

        .firma {
            background: white;
            margin-top: 10px;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .08);
        }
    </style>
</head>

<body>

    <h1>Sinadura Bilketa</h1>

    <form id='sinaduraForm'>

        <label>Izen-abizenak *</label>
        <input type="text" id="izen_abizenak" required>

        <label>Emaila *</label>
        <input type="email" id="emaila" required>

        <label>Egoera *</label>
        <select id="egoera" required>
            <option value="">Hautatu...</option>
            <option value="Ikaslea">Ikaslea</option>
            <option value="Langilea">Langilea</option>
        </select>

        <button type="submit">
            Sinatu
        </button>

        <div id="mezua"></div>

    </form>

    <div style="margin-top:40px">

        <h2>Jasotako sinadurak</h2>

        <div id="listaSinadurak"></div>

    </div>

    <script>

        const supabaseUrl="https://faqfkiwkvnsurekmjerv.supabase.co/rest/v1/";
        const supabaseKey="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZhcWZraXdrdm5zdXJla21qZXJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwODk5ODgsImV4cCI6MjEwNTY2NTk4OH0.dzTQbvM9vntFCmG5egS29OJV_Alt0GQayO7fjp4MyFg";

        const supabase=window.supabase.createClient(
            supabaseUrl,
            supabaseKey
        );

        const form=document.getElementById("sinaduraForm");
        const mezua=document.getElementById("mezua");

        form.addEventListener("submit", async (e) => {

            e.preventDefault();

            const izen_abizenak=
                document.getElementById("izen_abizenak").value;

            const emaila=
                document.getElementById("emaila").value;

            const egoera=
                document.getElementById("egoera").value;

            const {error}=await supabase
                .from("sinadurak")
                .insert([
                    {
                        izen_abizenak,
                        emaila,
                        egoera
                    }
                ]);

            if(error) {

                mezua.style.color="red";
                mezua.innerText=
                    "Errorea: "+error.message;

                return;
            }

            mezua.style.color="green";
            mezua.innerText=
                "Sinadura behar bezala erregistratu da";

            form.reset();

            kargatuSinadurak();

        });

        async function kargatuSinadurak() {

            const {data, error}=await supabase
                .from("sinadurak")
                .select("*")
                .order(
                    "created_at",
                    {ascending: false}
                );

            if(error) {
                return;
            }

            const lista=
                document.getElementById(
                    "listaSinadurak"
                );

            lista.innerHTML="";

            data.forEach(sinadura => {

                const div=
                    document.createElement("div");

                div.className="firma";

                div.innerHTML=`
            <strong>
                ${sinadura.izen_abizenak}
            </strong>
            <br>
            ${sinadura.egoera}
        `;

                lista.appendChild(div);

            });

        }

        kargatuSinadurak();

    </script>

</body>

</html>
