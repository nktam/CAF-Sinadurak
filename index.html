<!DOCTYPE html>
<html lang="eu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sinadura Bilketa</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f4f7fb 0%, #edf4ff 100%);
            max-width: 760px;
            margin: auto;
            padding: 24px;
            color: #1f2937;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #123b6b;
        }

        form {
            background: rgba(255, 255, 255, 0.95);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
            border: 1px solid #e5ebf5;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            background: linear-gradient(135deg, #0d6efd 0%, #0056d6 100%);
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 8px 16px rgba(13, 110, 253, 0.2);
        }

        button:hover {
            background: linear-gradient(135deg, #0056d6 0%, #0043a3 100%);
            transform: translateY(-1px);
        }

        #mezua {
            margin-top: 15px;
            font-weight: bold;
            min-height: 24px;
        }

        .contador {
            background: linear-gradient(135deg, #0f172a 0%, #1d4ed8 100%);
            color: #ffffff;
            border-radius: 12px;
            padding: 12px 16px;
            margin: 18px 0 14px;
            font-weight: 700;
            box-shadow: 0 10px 18px rgba(29, 78, 216, 0.18);
        }

        .firma {
            background: rgba(255, 255, 255, 0.95);
            margin-top: 12px;
            padding: 16px 18px;
            border-radius: 12px;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.06);
            border: 1px solid #edf2f7;
        }

        .firma strong {
            display: inline-block;
            margin-bottom: 6px;
            color: #123b6b;
        }
    </style>
</head>

<body>

    <h1>Sinadura Bilketa</h1>

    <form id='sinaduraForm'>

        <label>Izen-abizenak *</label>
        <input type="text" id="izen_abizenak" required>

        <label>Emaila *</label>
        <input type="email" id="emaila" required>

        <label>Egoera *</label>
        <select id="egoera" required>
            <option value="">Hautatu...</option>
            <option value="Ikaslea">Ikaslea</option>
            <option value="Langilea">Langilea</option>
        </select>

        <button type="submit">
            Sinatu
        </button>

        <div id="mezua"></div>

    </form>

    <div style="margin-top:40px">

        <h2>Jasotako sinadurak</h2>

        <div id="contadorSinadurak" class="contador">Sinadurak: 0</div>

        <div id="listaSinadurak"></div>

    </div>

    <script>

        const supabaseUrl='https://faqfkiwkvnsurekmjerv.supabase.co';
        const supabaseKey="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZhcWZraXdrdm5zdXJla21qZXJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwODk5ODgsImV4cCI6MjEwNTY2NTk4OH0.dzTQbvM9vntFCmG5egS29OJV_Alt0GQayO7fjp4MyFg";
        const supabaseClient=window.supabase.createClient(supabaseUrl, supabaseKey);

        const form=document.getElementById("sinaduraForm");
        const mezua=document.getElementById("mezua");
        const contadorSinadurak=document.getElementById("contadorSinadurak");

        form.addEventListener("submit", async (e) => {

            e.preventDefault();

            const izen_abizenak=
                document.getElementById("izen_abizenak").value;

            const emaila=
                document.getElementById("emaila").value;

            const egoera=
                document.getElementById("egoera").value;

            const {error}=await supabaseClient
                .from("sinadurak")
                .insert([
                    {
                        izen_abizenak,
                        emaila,
                        egoera
                    }
                ]);

            if(error) {

                mezua.style.color="red";
                mezua.innerText=
                    "Errorea: "+error.message;

                return;
            }

            mezua.style.color="green";
            mezua.innerText=
                "Sinadura behar bezala erregistratu da";

            form.reset();

            kargatuSinadurak();

        });

        async function kargatuSinadurak() {

            const {data, error}=await supabaseClient
                .from("sinadurak")
                .select("*")
                .order(
                    "created_at",
                    {ascending: false}
                )
                .limit(10);

            if(error) {
                return;
            }

            const {count, error: countError}=await supabaseClient
                .from("sinadurak")
                .select("*", {count: "exact", head: true});

            if(!countError&&typeof count==="number") {
                contadorSinadurak.textContent=`Sinadurak: ${count}`;
            }

            const lista=
                document.getElementById(
                    "listaSinadurak"
                );

            lista.innerHTML="";

            data.forEach(sinadura => {

                const div=
                    document.createElement("div");

                div.className="firma";

                div.innerHTML=`
            <strong>
                ${sinadura.izen_abizenak}
            </strong>
            <br>
            ${sinadura.egoera}
        `;

                lista.appendChild(div);

            });

        }

        kargatuSinadurak();

    </script>

</body>

</html>
